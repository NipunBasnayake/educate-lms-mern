  /api/notifications:
    post:
      summary: Create a new notification
      description: Creates a new notification by Instructor or Super Admin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipientId:
                  type: string
                  example: 64f7c9b2a1b2c3d4e5f6a789
                recipientType:
                  type: string
                  enum: [Student, Instructor, SuperAdmin]
                  example: Student
                message:
                  type: string
                  example: Your assignment is due tomorrow
                type:
                  type: string
                  enum: [announcement, grade, deadline, message]
                  example: deadline
              required:
                - recipientId
                - recipientType
                - message
                - type
      responses:
        '201':
          description: Notification created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  notification:
                    type: object
                    properties:
                      _id:
                        type: string
                      message:
                        type: string
                example:
                  message: Notification created
                  notification:
                    _id: 64f7c9b2a1b2c3d4e5f6a784
                    message: Your assignment is due tomorrow
        '400':
          description: Bad request (e.g., invalid recipient)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: Invalid recipient type
        '403':
          description: Access denied (non-Instructor/SuperAdmin)
          content:
            application/json:
